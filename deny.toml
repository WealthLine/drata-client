[advisories]
unmaintained = "workspace"   # transitive unmaintained crates are as unactionable
ignore = []                  # as duplicate versions

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0",           # unicode-ident, reached transitively by ~everything
    "MPL-2.0",               # file-level copyleft; does not infect linked code
    "CDLA-Permissive-2.0",   # webpki-roots — the Mozilla CA bundle, so anything
                             # doing TLS reaches it (rustls, ureq, reqwest, …)
]
confidence-threshold = 0.8
# The allowlist is anticipatory — "acceptable here", not "present today" — so an
# entry matching nothing in the tree is normal and warning about it is noise.
# Safe to silence because a *typo'd* identifier is caught separately and harder;
# see below.
unused-allowed-license = "allow"

# Unpublished crates — your own workspace members, and first-party crates
# consumed as git deps — commonly carry `LicenseRef-Proprietary`, which is valid
# SPDX but matches no allowlist entry, so the check fails on your own code.
# This skips crates that are `publish = false`, which is what they are.
# It does NOT skip proprietary crates generally: a third party's proprietary
# crate arriving from a registry is still rejected.
private = { ignore = true }

[bans]
multiple-versions = "warn"   # same unactionability that allowed clippy's lint
wildcards = "deny"           # matches clippy's denied wildcard_dependencies
allow-wildcard-paths = true  # ...but not for internal path deps; see below
deny = []
# workspace-default-features / external-default-features deliberately left at
# "allow" — see Features below.

[sources]
unknown-registry = "deny"    # template default is "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
